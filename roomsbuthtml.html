<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rooms: Ever-Changing</title>
<style>
  :root{ --ink:#e8e2d4; --dim:#8b8577; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:#05050a; overflow:hidden; touch-action:none;}
  body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; color:var(--ink); -webkit-user-select:none; user-select:none;}
  #v{display:block; width:100vw; height:100vh; image-rendering:pixelated; cursor:none;}
  .layer{position:fixed; inset:0; pointer-events:none;}
  #hud{padding:18px 20px; display:flex; flex-direction:column; gap:10px; text-shadow:0 2px 6px #000;}
  #door{font-size:30px; letter-spacing:.02em; line-height:1;}
  #door small{display:block; font-size:11px; letter-spacing:.28em; color:var(--dim); margin-bottom:5px; font-family:ui-monospace,monospace;}
  .meters{display:flex; gap:14px; align-items:center;}
  .bar{width:130px; height:5px; background:#1b1a20; border:1px solid #2c2a33;}
  .bar i{display:block; height:100%; background:var(--ink); transition:width .12s linear;}
  #hpbar i{background:#c25b4e;} #stbar i{background:#6f8f7a;} #btbar i{background:#c9a24a;}
  #carry{font-family:ui-monospace,monospace; font-size:12px; letter-spacing:.16em; color:var(--dim);}
  #hint{position:fixed; left:50%; bottom:13%; transform:translateX(-50%); font-size:15px; color:#d8d0be;
        background:rgba(6,6,10,.6); padding:7px 15px; border:1px solid #24222a; opacity:0; transition:opacity .18s;}
  #hint.on{opacity:1;}
  #whisper{position:fixed; left:50%; top:22%; transform:translateX(-50%); font-size:17px; letter-spacing:.05em;
           color:#b8452f; opacity:0; transition:opacity .25s; width:max-content; max-width:70vw; text-align:center;}
  #whisper.on{opacity:1;}
  .panel{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:radial-gradient(ellipse at center,#0b0a12 0%,#040407 75%); gap:16px; text-align:center; padding:28px;}
  .panel h1{font-size:clamp(34px,7vw,64px); font-weight:400; letter-spacing:.04em; line-height:1;}
  .panel h1 span{display:block; font-size:12px; letter-spacing:.42em; color:var(--dim); margin-bottom:14px; font-family:ui-monospace,monospace;}
  .panel p{max-width:46ch; color:#a9a396; font-size:15px; line-height:1.6;}
  .keys{display:grid; grid-template-columns:auto auto; gap:5px 16px; font-size:13px; color:#a9a396; margin-top:4px;}
  .keys b{font-family:ui-monospace,monospace; color:var(--ink); font-weight:400; text-align:right;}
  button{font:inherit; font-size:15px; padding:11px 26px; background:transparent; color:var(--ink);
         border:1px solid #4a4652; cursor:pointer; letter-spacing:.06em;}
  button:hover,button:focus-visible{background:#161520; outline:none; border-color:#8b8577;}
  #journal{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(430px,88vw);
           background:#0a0910; border:1px solid #35323e; padding:22px 24px; opacity:0; transition:opacity .4s; }
  #journal.on{opacity:1;}
  #journal h2{font-size:23px; font-weight:400; margin-bottom:8px;}
  #journal .tag{font-family:ui-monospace,monospace; font-size:11px; letter-spacing:.3em; color:#b8452f; margin-bottom:12px;}
  #journal p{font-size:14px; color:#a9a396; line-height:1.65;}
  #touch{position:fixed; inset:0; display:none;}
  #touch.on{display:block;}
  #stick{position:absolute; left:20px; bottom:24px; width:126px; height:126px; border-radius:50%; border:1px solid #2a2833;}
  #stick i{position:absolute; left:43px; top:43px; width:40px; height:40px; border-radius:50%; background:#2a2833;}
  .tbtn{position:absolute; right:20px; width:66px; height:66px; border-radius:50%; border:1px solid #3a3744;
        background:rgba(10,9,16,.55); display:flex; align-items:center; justify-content:center; font-size:13px;}
  #tE{bottom:96px;} #tF{bottom:22px; right:98px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<canvas id="v"></canvas>

<div class="layer" id="hud">
  <div id="door"><small>door</small><span id="doorn">0</span></div>
  <div class="meters">
    <div class="bar" id="hpbar"><i style="width:100%"></i></div>
    <div class="bar" id="stbar"><i style="width:100%"></i></div>
    <div class="bar" id="btbar"><i style="width:100%"></i></div>
  </div>
  <div id="carry">found 0</div>
</div>
<div id="hint"></div>
<div id="whisper"></div>
<div id="journal"></div>

<div id="touch">
  <div id="stick"><i></i></div>
  <div class="tbtn" id="tE">open</div>
  <div class="tbtn" id="tF">light</div>
</div>

<div class="panel" id="title">
  <h1><span>the hotel</span>Rooms</h1>
  <p>Walk the corridor. Open the door, take the next room. Every tenth door something new is in here with you, and each one wants a different mistake from you.</p>
  <div class="keys">
    <b>W A S D</b><span>walk</span>
    <b>mouse</b><span>look</span>
    <b>shift</b><span>run</span>
    <b>E</b><span>open door / hide in locker</span>
    <b>F</b><span>lighter</span>
  </div>
  <button id="start">Enter the first room</button>
</div>

<div class="panel hidden" id="dead">
  <h1><span id="deadby">caught</span>Door <em id="deadn" style="font-style:normal">0</em></h1>
  <p id="deadtip"></p>
  <button id="again">Walk back in</button>
</div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rndSeed=s=>()=>((s=s*1664525+1013904223|0)>>>8)/16777216;
let rnd=rndSeed(Date.now()&0x7fffffff);
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const angDiff=(a,b)=>{let d=(a-b+Math.PI*3)%(Math.PI*2)-Math.PI; return Math.abs(d);};

/* ---------- map ---------- */
const GW=1800, GH=44;
const EMPTY=0, WALL=1, DOOR=2, OPEN=3, LOCKER=4, SHELF=5;
let grid=new Uint8Array(GW*GH), rooms=[];
const at=(x,y)=>(x<0||y<0||x>=GW||y>=GH)?WALL:grid[y*GW+x];
const put=(x,y,v)=>{ if(x>=0&&y>=0&&x<GW&&y<GH) grid[y*GW+x]=v; };
const solid=(x,y)=>{const v=at(x|0,y|0); return v===WALL||v===DOOR||v===LOCKER||v===SHELF;};

function carve(x0,y0,w,h){ for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++) put(x,y,EMPTY); }

function genLevel(){
  grid.fill(WALL); rooms=[];
  let cx=4, prev=null;
  for(let i=0;i<240;i++){
    const hall = i>2 && rnd()<0.14;
    const w = hall ? ri(16,22) : ri(6,15);
    const h = hall ? ri(11,15) : ri(5,10);
    let y0 = prev ? clamp(prev.y0+ri(-3,3),2,GH-h-3) : Math.floor(GH/2-h/2);
    if(prev){ // guarantee vertical overlap so a straight corridor always connects
      const lo=Math.max(prev.y0+1,y0+1), hi=Math.min(prev.y1-1,y0+h-2);
      if(lo>hi) y0=clamp(prev.y0,2,GH-h-3);
    }
    const r={i, x0:cx, y0, x1:cx+w-1, y1:y0+h-1, lockers:[], door:null, hall,
             dark: i>3 && rnd()<0.26, lit:false};
    carve(r.x0,r.y0,w,h);
    if(prev){
      const lo=Math.max(prev.y0+1,r.y0+1), hi=Math.min(prev.y1-1,r.y1-1);
      const cy = lo<=hi ? ri(lo,hi) : Math.floor((r.y0+r.y1)/2);
      for(let x=prev.x1;x<=r.x0;x++) put(x,cy,EMPTY);
      const dx=Math.floor((prev.x1+r.x0)/2);
      put(dx,cy,DOOR);
      r.door={x:dx, y:cy, locked: i>4 && i%7===0};
    }
    // lockers: alcoves punched into the top or bottom wall
    const n = i<3 ? 2 : ri(1,2);
    for(let k=0;k<n;k++){
      const lx=ri(r.x0+1,r.x1-1), top=rnd()<0.5;
      const ly= top ? r.y0-1 : r.y1+1;
      if(ly<1||ly>=GH-1) continue;
      put(lx,ly,LOCKER); r.lockers.push({x:lx,y:ly});
    }
    // shelves and pillars, interior only — the perimeter ring always stays walkable
    if(w>5&&h>4){
      const dens = hall?0.13:0.09;
      const count=Math.floor(w*h*dens);
      for(let k=0;k<count;k++){
        const sx=ri(r.x0+1,r.x1-1), sy=ri(r.y0+1,r.y1-1);
        if(at(sx,sy)===EMPTY) put(sx,sy,SHELF);
      }
    }
    rooms.push(r); prev=r;
    cx = r.x1 + ri(4,7);
    if(cx>GW-30) break;
  }
  if(rooms[1]&&rooms[1].door) rooms[1].door.locked=false;
}

function freeTile(r){
  for(let k=0;k<40;k++){
    const x=ri(r.x0,r.x1), y=ri(r.y0,r.y1);
    if(at(x,y)===EMPTY) return {x:x+.5,y:y+.5};
  }
  return {x:(r.x0+r.x1)/2+.5, y:(r.y0+r.y1)/2+.5};
}

/* ---------- entities ---------- */
const CODEX={
  hum:{name:"The Hum",tag:"door 10",text:"You never see it, you only hear it thicken. It hunts the sound you make — running is a shout, walking is a mutter, standing perfectly still is silence. A locker muffles you completely."},
  mimic:{name:"Mimic",tag:"door 20",text:"It grows a door on a wall where there is no room behind. Real doors in this building have a brass handle. The mimic never gets the handle right."},
  wickmoth:{name:"Wickmoth",tag:"door 30",text:"It eats flame. While your lighter burns it comes straight for you and drinks the fuel. Put the light out and it forgets you were ever there."},
  tenant:{name:"The Tenant",tag:"door 40",text:"It walks, it does not run, and it does not stop. It opens lockers. Break its line of sight and keep something solid between you — it follows you through doors."},
  collector:{name:"Collector",tag:"door 50",text:"It wants what you are carrying, not what you are. It comes more often the heavier your pockets get, takes a handful, and leaves."}
};
const UNLOCK={10:"hum",20:"mimic",30:"wickmoth",40:"tenant",50:"collector"};

/* ---------- state ---------- */
const P={x:0,y:0,a:0,hp:100,st:100,bat:100,light:false,hidden:false,back:null};
let doorN=0, cur=0, running=false, roomT=0, hurtT=0, safeT=0, flick=1, flickT=0, shakeT=0;
let known={}, sprites=[], mobs=[], mimic=null, noiseLvl=0, lastLoud={x:0,y:0}, lockerT=0;
let camY=0, keys=0, gold=0, humGlow=0;

function reset(){
  rnd=rndSeed((Date.now()^(Math.random()*1e9))&0x7fffffff);
  genLevel();
  const r=rooms[0];
  P.x=r.x0+1.5; P.y=(r.y0+r.y1)/2+.5; P.a=0; P.hp=100; P.st=100; P.bat=100;
  P.light=false; P.hidden=false; P.back=null;
  doorN=0; cur=0; roomT=0; hurtT=0; safeT=0; flick=1; flickT=0;
  known={}; sprites=[]; mobs=[]; mimic=null; noiseLvl=0; lockerT=0;
  lastLoud={x:P.x,y:P.y};
  keys=0; gold=0; updateCarry();
  enterRoom(0);
  hint("Find the door. Press E to open it.",4);
}

function enterRoom(n){
  const chase = mobs.filter(m=>m.t==="tenant" && Math.hypot(m.x-P.x,m.y-P.y)<11);
  cur=n; doorN=n; roomT=0; sprites=[]; mobs=[]; mimic=null; lockerT=0;
  $("#doorn").textContent=n;
  const u=UNLOCK[n];
  if(u&&!known[u]){ known[u]=true; showJournal(CODEX[u]); }
  const r=rooms[cur];

  // the Tenant does not stay behind. it comes through with you.
  for(const m of chase){
    const d=r.door||{x:r.x0,y:(r.y0+r.y1)/2};
    mobs.push({t:"tenant", x:d.x+.5, y:d.y+.5, seen:2, lx:P.x, ly:P.y, sp:0});
    say("It came through with you.");
  }

  // light switch for a blacked-out room
  if(r.dark && !r.lit){
    const p=freeTile(r);
    sprites.push({t:"switch", x:p.x, y:p.y});
    hint("The lights are out. Find the switch.",3);
  }
  // key for the locked door ahead
  const nx=rooms[cur+1];
  if(nx && nx.door && nx.door.locked){
    const p=freeTile(r);
    sprites.push({t:"key", x:p.x, y:p.y});
    hint("The next door is locked. There is a key in here.",3.5);
  }
  // loot, batteries, first-aid
  let drops=ri(0,2) + (r.hall?1:0);
  while(drops-- > 0){
    const p=freeTile(r), roll=rnd();
    const t = roll<0.45 ? "gold" : roll<0.78 ? "battery" : "kit";
    sprites.push({t, x:p.x, y:p.y, bob:rnd()*6});
  }

  // --- entities ---
  if(known.hum && rnd()<0.34){
    const p=farTile(r);
    mobs.push({t:"hum", x:p.x, y:p.y, patience:26});
    noise(1.6,90,150,.2,"lowpass"); say("Something is listening.");
  }
  if(known.mimic && rnd()<0.4) placeMimic(r);
  if(known.wickmoth && rnd()<0.36){
    const p=farTile(r);
    mobs.push({t:"wickmoth", x:p.x, y:p.y, bob:rnd()*6, agitate:0});
  }
  if(known.tenant && !mobs.some(m=>m.t==="tenant") && rnd()<0.28){
    const p=farTile(r);
    mobs.push({t:"tenant", x:p.x, y:p.y, seen:0, lx:p.x, ly:p.y, sp:0});
    tone(1.4,70,52,.16,"sawtooth");
  }
  if(known.collector && rnd() < Math.min(0.55, 0.08+gold*0.02)){
    const p=farTile(r);
    mobs.push({t:"collector", x:p.x, y:p.y, bob:rnd()*6, fleeing:false});
  }
  for(const m of mobs) sprites.push(m);
}

function farTile(r){
  let best=null, bd=-1;
  for(let k=0;k<24;k++){
    const p=freeTile(r), d=Math.hypot(p.x-P.x,p.y-P.y);
    if(d>bd){ bd=d; best=p; }
  }
  return best;
}

// grow a fake door on a wall with no room behind it
function placeMimic(r){
  for(let k=0;k<30;k++){
    const top=rnd()<0.5;
    const mx=ri(r.x0+1,r.x1-1), my= top ? r.y0-1 : r.y1+1;
    if(at(mx,my)!==WALL) continue;
    if(at(mx, top?my-1:my+1)!==WALL) continue;   // must be solid behind it
    put(mx,my,DOOR); mimic={x:mx,y:my}; return;
  }
}

/* ---------- audio ---------- */
let AC=null, drone=null, noiseBuf=null;
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const len=AC.sampleRate*2; noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const g=AC.createGain(); g.gain.value=0.05; g.connect(AC.destination);
  const f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=180; f.connect(g);
  [41,41.7,62].forEach(hz=>{const o=AC.createOscillator(); o.type="sawtooth"; o.frequency.value=hz; o.connect(f); o.start();});
  drone=g;
}
function noise(dur,f0,f1,vol,type){
  if(!AC) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const bp=AC.createBiquadFilter(); bp.type=type||"bandpass"; bp.Q.value=1.1;
  bp.frequency.setValueAtTime(f0,AC.currentTime);
  bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1),AC.currentTime+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  s.connect(bp); bp.connect(g); g.connect(AC.destination); s.start(); s.stop(AC.currentTime+dur);
}
function tone(dur,f0,f1,vol,type){
  if(!AC) return;
  const o=AC.createOscillator(); o.type=type||"sine";
  o.frequency.setValueAtTime(f0,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),AC.currentTime+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
}
const sfxDoor =()=>{noise(.4,900,90,.35,"lowpass"); tone(.3,120,60,.2,"square");};
const sfxLock =()=>noise(.25,2200,400,.2);
const sfxHurt =()=>{tone(.5,220,60,.3,"sawtooth"); noise(.4,700,120,.25);};
const sfxClick=()=>noise(.06,3000,1200,.12);

/* ---------- ui ---------- */
let hintT=0;
function hint(t,secs){ $("#hint").textContent=t; $("#hint").classList.add("on"); hintT=secs||2.2; }
function showJournal(c){
  const j=$("#journal");
  j.innerHTML='<div class="tag">'+c.tag+'</div><h2>'+c.name+'</h2><p>'+c.text+'</p>';
  j.classList.add("on"); setTimeout(()=>j.classList.remove("on"),6500);
  tone(1.2,300,120,.12,"triangle");
}

/* ---------- input ---------- */
const K={};
addEventListener("keydown",e=>{
  if(["KeyW","KeyA","KeyS","KeyD","Space","ShiftLeft"].includes(e.code)) e.preventDefault();
  if(K[e.code]) return; K[e.code]=true;
  if(e.code==="KeyE") interact();
  if(e.code==="KeyF") toggleLight();
});
addEventListener("keyup",e=>{K[e.code]=false;});
const cv=$("#v");
cv.addEventListener("click",()=>{ if(running && !document.pointerLockElement) cv.requestPointerLock(); });
addEventListener("mousemove",e=>{ if(document.pointerLockElement===cv) P.a+=e.movementX*0.0026; });

// touch
let tId=null, tOrig={x:0,y:0}, tVec={x:0,y:0}, lookId=null, lookX=0;
const isTouch=matchMedia("(pointer:coarse)").matches;
if(isTouch) $("#touch").classList.add("on");
function tstart(e){
  for(const t of e.changedTouches){
    if(t.clientX<innerWidth*0.45 && tId===null){ tId=t.identifier; tOrig={x:t.clientX,y:t.clientY}; }
    else if(lookId===null){ lookId=t.identifier; lookX=t.clientX; }
  }
}
function tmove(e){
  for(const t of e.changedTouches){
    if(t.identifier===tId){
      const dx=clamp(t.clientX-tOrig.x,-52,52), dy=clamp(t.clientY-tOrig.y,-52,52);
      tVec={x:dx/52,y:dy/52};
      $("#stick i").style.transform=`translate(${dx*0.8}px,${dy*0.8}px)`;
    } else if(t.identifier===lookId){ P.a+=(t.clientX-lookX)*0.006; lookX=t.clientX; }
  }
}
function tend(e){
  for(const t of e.changedTouches){
    if(t.identifier===tId){ tId=null; tVec={x:0,y:0}; $("#stick i").style.transform=""; }
    if(t.identifier===lookId) lookId=null;
  }
}
addEventListener("touchstart",tstart,{passive:true});
addEventListener("touchmove",tmove,{passive:true});
addEventListener("touchend",tend,{passive:true});
addEventListener("touchcancel",tend,{passive:true});
$("#tE").addEventListener("touchstart",e=>{e.stopPropagation(); interact();});
$("#tF").addEventListener("touchstart",e=>{e.stopPropagation(); toggleLight();});

function toggleLight(){ if(P.bat>2){ P.light=!P.light; sfxClick(); } }

function interact(){
  if(!running) return;
  if(P.hidden){ P.x=P.back.x; P.y=P.back.y; P.hidden=false; sfxLock(); hint("",0); return; }
  // light switch first — it is the thing you are usually reaching for in a dark room
  for(const s of sprites){
    if(s.t!=="switch") continue;
    if(Math.hypot(s.x-P.x,s.y-P.y)<1.6){
      rooms[cur].lit=true; sprites=sprites.filter(o=>o!==s);
      sfxClick(); tone(.4,300,420,.14,"triangle");
      hint("Lights on.",2); return;
    }
  }
  const fx=P.x+Math.cos(P.a)*0.9, fy=P.y+Math.sin(P.a)*0.9;
  for(let oy=-1;oy<=1;oy++) for(let ox=-1;ox<=1;ox++){
    const tx=(fx|0)+ox, ty=(fy|0)+oy;
    const d=Math.hypot(tx+.5-P.x,ty+.5-P.y);
    if(d>1.7) continue;
    const v=at(tx,ty);
    if(v===DOOR){
      if(mimic&&mimic.x===tx&&mimic.y===ty){
        put(tx,ty,WALL); mimic=null;
        tone(.6,900,90,.35,"sawtooth"); noise(.6,2600,300,.3);
        damage(45,"the mimic bit you");
        say("There was no room behind it.");
        return;
      }
      const nx=rooms[cur+1], isNext = nx&&nx.door&&nx.door.x===tx&&nx.door.y===ty;
      if(isNext && nx.door.locked){
        if(keys<=0){ sfxLock(); hint("Locked. The key is somewhere in this room.",2.5); return; }
        keys--; nx.door.locked=false; updateCarry(); hint("Unlocked.",1.6);
      }
      put(tx,ty,OPEN); sfxDoor();
      if(isNext) enterRoom(cur+1);
      return;
    }
    if(v===LOCKER){
      P.back={x:P.x,y:P.y}; P.x=tx+.5; P.y=ty+.5; P.hidden=true; sfxLock();
      hint("Hidden. Press E to step out.",2.5); return;
    }
  }
  hint("Nothing here.",1.2);
}

function updateCarry(){
  $("#carry").textContent = (keys>0? "key ×"+keys+"   " : "") + "found "+gold;
}

function pickups(){
  if(P.hidden) return;
  for(const s of sprites.slice()){
    if(s.t!=="gold"&&s.t!=="battery"&&s.t!=="kit"&&s.t!=="key") continue;
    if(Math.hypot(s.x-P.x,s.y-P.y)>0.7) continue;
    sprites=sprites.filter(o=>o!==s);
    if(s.t==="gold"){ gold++; tone(.25,880,1320,.16,"triangle"); }
    else if(s.t==="battery"){ P.bat=Math.min(100,P.bat+45); tone(.2,420,620,.14,"square"); hint("Battery.",1.4); }
    else if(s.t==="kit"){ P.hp=Math.min(100,P.hp+35); tone(.35,300,500,.16,"sine"); hint("Patched up.",1.4); }
    else { keys++; sfxLock(); hint("Key. The door ahead will open now.",2.4); }
    updateCarry();
  }
}

/* ---------- theme ---------- */
const THEME={h:32, s:14, fog:"hsl(30,20%,3%)", floorL:11, ceilL:5};
function theme(){ return THEME; }

/* ---------- render ---------- */
const ctx=cv.getContext("2d",{alpha:false});
let CW=0,CH=0,RAYS=0,STEP=2;
let zbuf=new Float32Array(1);
function resize(){
  const s = isTouch?0.6:0.62;
  CW=Math.max(320,Math.floor(innerWidth*s)); CH=Math.max(200,Math.floor(innerHeight*s));
  cv.width=CW; cv.height=CH; RAYS=Math.ceil(CW/STEP); zbuf=new Float32Array(RAYS);
  ctx.imageSmoothingEnabled=false;
}
addEventListener("resize",resize); resize();

const FOV=Math.PI/2.9;
function isDark(){ const r=rooms[cur]; return !!(r&&r.dark&&!r.lit); }
function viewDist(){ return (P.light?13:7.2) * (isDark()?0.5:1); }

function render(){
  const th=theme();
  const dk=isDark()?0.34:1;
  const vd=viewDist(), horizon=CH/2 + camY;
  // ceiling & floor
  let g=ctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,`hsl(${th.h},${th.s}%,${(th.ceilL+3)*dk}%)`); g.addColorStop(1,th.fog);
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,horizon+1);
  g=ctx.createLinearGradient(0,horizon,0,CH);
  g.addColorStop(0,th.fog); g.addColorStop(1,`hsl(${th.h},${th.s}%,${th.floorL*dk}%)`);
  ctx.fillStyle=g; ctx.fillRect(0,horizon,CW,CH-horizon);

  const dirx=Math.cos(P.a), diry=Math.sin(P.a);
  const px=-diry*Math.tan(FOV/2), py=dirx*Math.tan(FOV/2);

  for(let r=0;r<RAYS;r++){
    const cam=2*(r*STEP)/CW-1;
    const rdx=dirx+px*cam, rdy=diry+py*cam;
    let mx=P.x|0, my=P.y|0;
    const ddx=Math.abs(1/(rdx||1e-6)), ddy=Math.abs(1/(rdy||1e-6));
    let sx,sy,sdx,sdy;
    if(rdx<0){sx=-1; sdx=(P.x-mx)*ddx;} else {sx=1; sdx=(mx+1-P.x)*ddx;}
    if(rdy<0){sy=-1; sdy=(P.y-my)*ddy;} else {sy=1; sdy=(my+1-P.y)*ddy;}
    let side=0, hit=0, tile=WALL, steps=0;
    while(steps++<80){
      if(sdx<sdy){sdx+=ddx; mx+=sx; side=0;} else {sdy+=ddy; my+=sy; side=1;}
      const v=at(mx,my);
      if(v===WALL||v===DOOR||v===LOCKER||v===SHELF){ tile=v; hit=1; break; }
    }
    let dist = side===0 ? (sdx-ddx) : (sdy-ddy);
    if(!hit) dist=60;
    dist=Math.max(0.02,dist);
    zbuf[r]=dist;
    const hgt=Math.min(CH*4, (CH/dist)*0.95);
    const y0=horizon-hgt/2;
    // wall shade
    let hx = side===0 ? P.y+dist*rdy : P.x+dist*rdx; hx-=Math.floor(hx);
    let bright = clamp(1-dist/vd,0,1); bright*= side? .72:1;
    bright *= 0.86+0.14*Math.sin(hx*Math.PI*3);   // faint panelling
    bright *= flick;
    let hue=th.h, sat=th.s, lig=bright*34;
    if(tile===DOOR){ hue=16; sat=30; lig=bright*26; }
    if(tile===LOCKER){ hue=205; sat=10; lig=bright*30; }
    if(tile===SHELF){ hue=24; sat=26; lig=bright*20; }
    let ry=y0, rh=hgt;
    if(tile===SHELF){ rh=hgt*0.72; ry=horizon+hgt/2-rh; }   // stands on the floor, short
    if(lig<0.4){ ctx.fillStyle=th.fog; } else ctx.fillStyle=`hsl(${hue},${sat}%,${lig.toFixed(1)}%)`;
    ctx.fillRect(r*STEP,ry,STEP+1,rh);
    if(tile===SHELF&&bright>0.1){
      ctx.fillStyle=`hsl(24,20%,${(bright*8).toFixed(1)}%)`;
      ctx.fillRect(r*STEP, ry+rh*0.34, STEP+1, Math.max(1,rh*0.05));
      ctx.fillRect(r*STEP, ry+rh*0.68, STEP+1, Math.max(1,rh*0.05));
    }
    if(tile===DOOR&&bright>0.12&&!(mimic&&mimic.x===mx&&mimic.y===my)){ // handle: real doors only
      ctx.fillStyle=`hsl(46,40%,${(bright*44).toFixed(1)}%)`;
      ctx.fillRect(r*STEP, horizon+hgt*0.06, STEP+1, Math.max(1,hgt*0.03));
    }
    if(tile===LOCKER&&bright>0.1){
      ctx.fillStyle=`hsl(20,18%,${(bright*12).toFixed(1)}%)`;
      ctx.fillRect(r*STEP, y0+hgt*0.22, STEP+1, Math.max(1,hgt*0.06));
      ctx.fillRect(r*STEP, y0+hgt*0.34, STEP+1, Math.max(1,hgt*0.06));
    }
  }

  // sprites (billboards)
  const list=sprites.slice().sort((a,b)=>Math.hypot(b.x-P.x,b.y-P.y)-Math.hypot(a.x-P.x,a.y-P.y));
  for(const s of list){
    const dx=s.x-P.x, dy=s.y-P.y;
    const inv=1/(px*diry-dirx*py);
    const tx=inv*(diry*dx-dirx*dy), ty=inv*(-py*dx+px*dy);
    if(ty<=0.25) continue;
    const scr=Math.floor((CW/2)*(1+tx/ty));
    const h=Math.min(CH*2.2,(CH/ty)*0.8);
    const col=clamp(Math.floor(scr/STEP),0,RAYS-1);
    if(zbuf[col]<ty-0.3) continue;
    const bright=clamp(1-ty/(viewDist()+3),0.05,1);
    drawSprite(s,scr,horizon,h,bright,ty);
  }

  // the Hum is invisible — the room itself reacts to it
  if(humGlow>0.02){
    ctx.save();
    ctx.globalAlpha=clamp(humGlow*0.55,0,0.75);
    const rg=ctx.createRadialGradient(CW/2,CH/2,CH*0.1,CW/2,CH/2,CH*0.9);
    rg.addColorStop(0,"rgba(0,0,0,0)"); rg.addColorStop(1,"#120204");
    ctx.fillStyle=rg; ctx.fillRect(0,0,CW,CH);
    const n=Math.floor(humGlow*26);
    ctx.globalAlpha=humGlow*0.16; ctx.fillStyle="#000";
    for(let i=0;i<n;i++){
      const yy=Math.random()*CH, hh=1+Math.random()*3;
      ctx.fillRect(0,yy,CW,hh);
    }
    ctx.restore();
  }

  // hidden-in-locker framing
  if(P.hidden){
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,CW,CH*0.14); ctx.fillRect(0,CH*0.86,CW,CH*0.14);
    ctx.fillRect(0,0,CW*0.13,CH); ctx.fillRect(CW*0.87,0,CW*0.13,CH);
  }

  // vignette + damage flash
  const vg=ctx.createRadialGradient(CW/2,CH/2,CH*0.18,CW/2,CH/2,CH*0.85);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,0.85)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,CW,CH);
  if(hurtT>0){ ctx.fillStyle=`rgba(150,20,15,${hurtT*0.5})`; ctx.fillRect(0,0,CW,CH); }
}

function drawSprite(s,scr,horizon,h,b,ty){
  const bob=Math.sin(performance.now()/520+(s.bob||0))*h*0.012;
  if(s.t==="gold"||s.t==="battery"||s.t==="kit"||s.t==="key"){
    const w=h*0.1, base=horizon+h*0.30+bob;
    ctx.save(); ctx.globalAlpha=clamp(b*1.2,0,1);
    if(s.t==="gold"){
      ctx.fillStyle="#d8ab3f";
      ctx.beginPath(); ctx.ellipse(scr,base,w*0.5,w*0.6,0,0,7); ctx.fill();
      ctx.fillStyle="#f2d780";
      ctx.beginPath(); ctx.ellipse(scr,base-w*0.1,w*0.28,w*0.34,0,0,7); ctx.fill();
    } else if(s.t==="battery"){
      ctx.fillStyle="#2f6b4e"; ctx.fillRect(scr-w*0.32,base-w*0.7,w*0.64,w*1.3);
      ctx.fillStyle="#c8c2b0"; ctx.fillRect(scr-w*0.12,base-w*0.85,w*0.24,w*0.18);
    } else if(s.t==="kit"){
      ctx.fillStyle="#d8d2c4"; ctx.fillRect(scr-w*0.5,base-w*0.42,w,w*0.85);
      ctx.fillStyle="#b8452f";
      ctx.fillRect(scr-w*0.09,base-w*0.28,w*0.18,w*0.55);
      ctx.fillRect(scr-w*0.32,base-w*0.05,w*0.64,w*0.18);
    } else {
      ctx.fillStyle="#e0bb52";
      ctx.beginPath(); ctx.ellipse(scr,base-w*0.45,w*0.26,w*0.26,0,0,7); ctx.fill();
      ctx.fillRect(scr-w*0.07,base-w*0.35,w*0.14,w*0.85);
      ctx.fillRect(scr,base+w*0.25,w*0.28,w*0.12);
      ctx.fillRect(scr,base+w*0.45,w*0.22,w*0.12);
    }
    ctx.restore();
    // faint glow so loot reads in the dark
    ctx.globalAlpha=clamp(b*0.22,0,1);
    ctx.fillStyle= s.t==="kit"?"#ffd9d0":"#ffe6a8";
    ctx.beginPath(); ctx.ellipse(scr,base,w*1.5,w*1.5,0,0,7); ctx.fill();
    ctx.globalAlpha=1;
    return;
  }
  if(s.t==="switch"){
    const w=h*0.07, base=horizon;
    ctx.globalAlpha=clamp(b*1.3,0,1);
    ctx.fillStyle="#cfc9b8"; ctx.fillRect(scr-w*0.5,base-w*0.8,w,w*1.6);
    ctx.fillStyle="#8a8478"; ctx.fillRect(scr-w*0.18,base-w*0.3,w*0.36,w*0.7);
    ctx.globalAlpha=clamp(b*0.3,0,1);
    ctx.fillStyle="#fff6d8";
    ctx.beginPath(); ctx.ellipse(scr,base,w*2.4,w*2.4,0,0,7); ctx.fill();
    ctx.globalAlpha=1;
    return;
  }
  if(s.t==="tenant"){
    // tall, thin, stooped; a long pale face and nothing else
    const w=h*0.30, top=horizon-h*0.52;
    ctx.globalAlpha=clamp(b*1.5,0,1);
    ctx.fillStyle="#07070a";
    ctx.beginPath();
    ctx.moveTo(scr-w*0.34, horizon+h*0.42);
    ctx.lineTo(scr-w*0.20, top+h*0.30);
    ctx.lineTo(scr+w*0.20, top+h*0.30);
    ctx.lineTo(scr+w*0.34, horizon+h*0.42);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(scr-w*0.06, top+h*0.12, w*0.12, h*0.22);      // neck
    ctx.fillStyle="#cfc7b6";
    ctx.beginPath(); ctx.ellipse(scr, top+h*0.08, w*0.16, h*0.09, 0,0,7); ctx.fill();
    ctx.fillStyle="#0a0a0d";
    ctx.beginPath(); ctx.ellipse(scr, top+h*0.11, w*0.05, h*0.035, 0,0,7); ctx.fill();
    ctx.globalAlpha=1;
    return;
  }
  if(s.t==="wickmoth"){
    // pale moth, wings beating faster the closer it gets to a flame
    const w=h*0.28, cy2=horizon-h*0.05+bob*3;
    const beat=Math.sin(performance.now()/(P.light?70:220)+(s.bob||0));
    ctx.globalAlpha=clamp(b*1.3,0,1);
    ctx.fillStyle=P.light?"#d9c9a4":"#8f8878";
    for(const sgn of [-1,1]){
      ctx.beginPath();
      ctx.ellipse(scr+sgn*w*0.34, cy2, w*0.30*(0.55+Math.abs(beat)*0.45), w*0.44, sgn*beat*0.5, 0,7);
      ctx.fill();
    }
    ctx.fillStyle="#3a3227";
    ctx.beginPath(); ctx.ellipse(scr, cy2, w*0.10, w*0.34, 0,0,7); ctx.fill();
    if(P.light){
      ctx.globalAlpha=clamp(b*0.5,0,1); ctx.fillStyle="#ffcf7a";
      ctx.beginPath(); ctx.ellipse(scr, cy2-w*0.3, w*0.05, w*0.05, 0,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
    return;
  }
  if(s.t==="collector"){
    // small, hunched, dragging a full sack
    const w=h*0.26, base=horizon+h*0.26;
    ctx.globalAlpha=clamp(b*1.4,0,1);
    ctx.fillStyle="#14121a";
    ctx.beginPath(); ctx.ellipse(scr, base-w*0.5, w*0.42, w*0.55, 0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(scr-w*0.1, base-w*1.05, w*0.22, w*0.22, 0,0,7); ctx.fill();
    ctx.fillStyle="#6a5a2e";
    ctx.beginPath(); ctx.ellipse(scr+w*0.5, base-w*0.35, w*0.32, w*0.34, 0,0,7); ctx.fill();
    ctx.fillStyle="#e2bb52"; ctx.globalAlpha=clamp(b*0.9,0,1);
    ctx.beginPath(); ctx.ellipse(scr+w*0.5, base-w*0.62, w*0.09, w*0.07, 0,0,7); ctx.fill();
    ctx.globalAlpha=1;
    return;
  }
  if(s.t==="hum"){
    // not visible, only a smear where the air is wrong
    ctx.globalAlpha=clamp(b*0.14,0,0.2);
    ctx.fillStyle="#000";
    ctx.beginPath(); ctx.ellipse(scr, horizon, h*0.22, h*0.5, 0,0,7); ctx.fill();
    ctx.globalAlpha=1;
    return;
  }
}

/* ---------- movement & logic ---------- */
function move(dt){
  if(P.hidden) return;
  let fw=0,sd=0;
  if(K.KeyW)fw+=1; if(K.KeyS)fw-=1; if(K.KeyD)sd+=1; if(K.KeyA)sd-=1;
  if(K.ArrowUp)fw+=1; if(K.ArrowDown)fw-=1;
  if(K.ArrowLeft)P.a-=1.9*dt; if(K.ArrowRight)P.a+=1.9*dt;
  if(isTouch){ fw-=tVec.y; sd+=tVec.x; }
  fw=clamp(fw,-1,1); sd=clamp(sd,-1,1);
  const wants=(fw||sd)&&(K.ShiftLeft||K.ShiftRight)&&P.st>1;
  const sp=(wants?4.4:2.55)*dt;
  if(wants&&(fw||sd)){ P.st=Math.max(0,P.st-30*dt); } else { P.st=Math.min(100,P.st+16*dt); }
  const dx=(Math.cos(P.a)*fw - Math.sin(P.a)*sd)*sp;
  const dy=(Math.sin(P.a)*fw + Math.cos(P.a)*sd)*sp;
  const R=0.26;
  if(!solid(P.x+dx+Math.sign(dx)*R,P.y)) P.x+=dx;
  if(!solid(P.x,P.y+dy+Math.sign(dy)*R)) P.y+=dy;
  camY = Math.sin(performance.now()/(wants?150:230))*(fw||sd?(wants?3.4:2):0);
}

function damage(n,cause){
  if(P.hp<=0) return;
  P.hp=Math.max(0,P.hp-n); hurtT=.6; sfxHurt(); safeT=0;
  if(P.hp<=0) die(cause);
}
function die(cause){
  running=false; document.exitPointerLock&&document.exitPointerLock();
  $("#deadby").textContent=cause;
  $("#deadn").textContent=doorN;
  const tips={ "the hum found you":"It follows the noise you make. Stop moving, or get into a locker, and it drifts off.",
    "the mimic bit you":"Check the handle. Every real door in this building has one.",
    "the wickmoth got you":"It only hunts a lit flame. Kill the lighter and it loses interest immediately.",
    "the tenant caught you":"You cannot outhide it, only outwalk it. Break its sightline and keep a wall between you.",
    "the tenant opened the locker":"Lockers do not stop the Tenant. Keep moving toward the door instead.",
    "it opened the locker":"You stayed hidden too long. A locker buys seconds, not minutes." };
  $("#deadtip").textContent=(tips[cause]||"")+"  You found "+gold+" pieces of loot.";
  $("#dead").classList.remove("hidden");
}

function update(dt){
  const prevX=P.x, prevY=P.y;
  roomT+=dt;
  // lighter battery
  if(P.light){ P.bat=Math.max(0,P.bat-7*dt); if(P.bat<=0){P.light=false; sfxClick();} }
  else P.bat=Math.min(100,P.bat+3.4*dt);
  // flicker
  if(flickT>0){ flickT-=dt; flick = Math.random()<0.4 ? 0.15+Math.random()*0.4 : 1; }
  else flick=1;
  if(hurtT>0) hurtT-=dt*1.6;
  // slow regen
  safeT+=dt;
  if(safeT>9 && P.hp>0) P.hp=Math.min(100,P.hp+3.5*dt);

  move(dt);
  pickups();

  // interactable prompts
  for(const s of sprites){
    if(s.t==="switch"&&Math.hypot(s.x-P.x,s.y-P.y)<1.6){ hint("Press E for the lights",.4); break; }
  }

  // door proximity hint
  const nx=rooms[cur+1];
  if(nx&&nx.door&&Math.hypot(nx.door.x+.5-P.x,nx.door.y+.5-P.y)<2.2&&at(nx.door.x,nx.door.y)===DOOR)
    hint("Press E to open door "+(cur+1),.4);

  // ---- noise you make, which is what the Hum tracks ----
  const spd=Math.hypot(P.x-prevX,P.y-prevY)/Math.max(dt,1e-4);
  const made = P.hidden ? 0 : spd<0.15 ? 0 : spd>3.4 ? 1 : 0.45;
  noiseLvl += (made-noiseLvl)*Math.min(1,dt*3);
  if(made>0.2){ lastLoud.x=P.x; lastLoud.y=P.y; }

  // ---- locker patience: you cannot live in there ----
  if(P.hidden){
    lockerT+=dt;
    if(lockerT>16&&lockerT-dt<=16) { sfxLock(); say("Something taps on the door."); }
    if(lockerT>21){ P.x=P.back.x; P.y=P.back.y; P.hidden=false; lockerT=0; damage(28,"it opened the locker"); }
  } else lockerT=0;

  updateMobs(dt);

  // hud
  $("#hpbar i").style.width=P.hp+"%";
  $("#stbar i").style.width=P.st+"%";
  $("#btbar i").style.width=P.bat+"%";
  if(hintT>0){ hintT-=dt; if(hintT<=0) $("#hint").classList.remove("on"); }
  // heartbeat
  if(P.hp<35 && Math.random()<dt*2.2) tone(.16,70,45,.18,"sine");
}

/* ---------- entity behaviour ---------- */
function los(ax,ay,bx,by){
  const d=Math.hypot(bx-ax,by-ay), n=Math.ceil(d/0.2);
  for(let i=1;i<n;i++){
    const t=i/n;
    if(solid(ax+(bx-ax)*t, ay+(by-ay)*t)) return false;
  }
  return true;
}
function step(m,tx,ty,sp,dt){
  const dx=tx-m.x, dy=ty-m.y, d=Math.hypot(dx,dy)||1;
  const vx=dx/d*sp*dt, vy=dy/d*sp*dt;
  if(!solid(m.x+vx+Math.sign(vx)*0.2, m.y)) m.x+=vx;
  if(!solid(m.x, m.y+vy+Math.sign(vy)*0.2)) m.y+=vy;
}
function kill(m){ mobs=mobs.filter(o=>o!==m); sprites=sprites.filter(o=>o!==m); }

let sayT=0;
function say(t){ $("#whisper").textContent=t; $("#whisper").classList.add("on"); sayT=2.6; }

function updateMobs(dt){
  if(sayT>0){ sayT-=dt; if(sayT<=0) $("#whisper").classList.remove("on"); }
  let humNear=0;

  for(const m of mobs.slice()){
    const dist=Math.hypot(m.x-P.x,m.y-P.y);

    if(m.t==="hum"){
      // hunts the noise you make. silence starves it, and silence is also safety.
      const quiet = noiseLvl<0.12;
      if(quiet){
        // it has nothing to follow, so it mills around where it last heard you
        if(!m.wx||Math.hypot(m.wx-m.x,m.wy-m.y)<0.5||Math.random()<dt*0.4){
          m.wx=lastLoud.x+(Math.random()-0.5)*7; m.wy=lastLoud.y+(Math.random()-0.5)*7;
        }
        step(m,m.wx,m.wy,0.75,dt);
        m.patience-=dt;
        if(m.patience<=0){ kill(m); say("It drifted off."); }
      } else {
        step(m, noiseLvl>0.6?P.x:lastLoud.x, noiseLvl>0.6?P.y:lastLoud.y, 1.0+noiseLvl*2.8, dt);
        m.patience=Math.min(26,m.patience+dt*0.6);
        if(dist<0.9 && !P.hidden) damage(100,"the hum found you");
      }
      humNear=Math.max(humNear, clamp(1-dist/9,0,1));
      if(Math.random()<dt*(0.3+humNear)) tone(.5,58+humNear*30,50,.05+humNear*0.2,"sawtooth");
      if(humNear>0.55) flickT=Math.max(flickT,0.1);
      continue;
    }

    if(m.t==="wickmoth"){
      // drinks flame. it only cares about you while the lighter is lit.
      if(P.light && !P.hidden){
        m.agitate=Math.min(1,m.agitate+dt*0.8);
        step(m,P.x,P.y,1.6+m.agitate*2.4,dt);
        if(dist<6){ P.bat=Math.max(0,P.bat-9*dt); if(P.bat<=0) P.light=false; }
        if(dist<1.0) damage(24*dt,"the wickmoth got you");
        if(Math.random()<dt*2) tone(.12,1400+Math.random()*700,900,.05,"triangle");
      } else {
        m.agitate=Math.max(0,m.agitate-dt*0.5);
        step(m, m.x+(m.x-P.x), m.y+(m.y-P.y), 0.7, dt);
      }
      continue;
    }

    if(m.t==="tenant"){
      // slow, relentless, checks lockers, follows you through doors
      const canSee = los(m.x,m.y,P.x,P.y) && dist<18;
      if(canSee){ m.seen=2.5; m.lx=P.x; m.ly=P.y; }
      else m.seen=Math.max(0,m.seen-dt);
      if(m.seen<=0 && Math.hypot(m.lx-m.x,m.ly-m.y)<0.7){   // lost you: search the room
        const r=rooms[cur]; m.lx=ri(r.x0,r.x1)+.5; m.ly=ri(r.y0,r.y1)+.5;
      }
      step(m,m.lx,m.ly,m.seen>0?1.45:1.05,dt);
      if(P.hidden && dist<1.3){
        P.x=P.back.x; P.y=P.back.y; P.hidden=false;
        damage(35,"the tenant opened the locker"); say("It found the locker.");
      }
      if(dist<0.95 && !P.hidden) damage(38*dt,"the tenant caught you");
      if(Math.random()<dt*0.7) tone(.3,64,58,.06+clamp(1-dist/14,0,1)*0.14,"sawtooth");
      continue;
    }

    if(m.t==="collector"){
      // wants your pockets, not your life
      if(m.fleeing){
        step(m, m.x*2-P.x, m.y*2-P.y, 3.4, dt);
        m.gone=(m.gone||0)+dt; if(m.gone>3) kill(m);
      } else {
        step(m,P.x,P.y,2.15,dt);
        if(dist<0.8 && !P.hidden){
          const took=Math.min(gold,ri(2,5));
          gold-=took; updateCarry(); m.fleeing=true;
          tone(.4,700,240,.2,"square"); sfxLock();
          say(took? "It took "+took+" from your pockets." : "It found nothing on you.");
        }
      }
      continue;
    }
  }
  humGlow += (humNear-humGlow)*Math.min(1,dt*4);
}
let last=performance.now();
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000); last=t;
  if(running) update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- boot ---------- */
function begin(){
  initAudio(); if(AC.state==="suspended") AC.resume();
  reset(); running=true;
  $("#title").classList.add("hidden"); $("#dead").classList.add("hidden");
  $("#doorn").textContent="0";
  if(!isTouch) cv.requestPointerLock();
}
$("#start").addEventListener("click",begin);
$("#again").addEventListener("click",begin);
render();
</script>
